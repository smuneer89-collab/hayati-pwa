(()=>{'use strict';
const V=window.HAYATI_QURAN_VERSES||[],P=window.HAYATI_QCF_PAGES||[],N=window.HAYATI_SURAH_NAMES||[];const KEY='hayati-quran-v10';
const state=(()=>{try{return {...{last:{page:1,line:0,surah:1,ayah:1,at:''},favSurahs:[],favAyahs:[],bookmarks:[],theme:'paper'},...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return {last:{page:1,line:0,surah:1,ayah:1,at:''},favSurahs:[],favAyahs:[],bookmarks:[],theme:'paper'}}})();
state.favSurahs=Array.isArray(state.favSurahs)?state.favSurahs:[];state.favAyahs=Array.isArray(state.favAyahs)?state.favAyahs:[];state.bookmarks=Array.isArray(state.bookmarks)?state.bookmarks:[];let snapTimer=null;function quranSnapshot(){clearTimeout(snapTimer);snapTimer=setTimeout(()=>{try{const sk='hayati-backup-snapshots-v1',list=JSON.parse(localStorage.getItem(sk)||'[]'),data={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&(k.startsWith('hayati-')||k==='hayati-theme')&&k!==sk)data[k]=localStorage.getItem(k)}const fingerprint=JSON.stringify(data);if(list[0]?.fingerprint===fingerprint)return;list.unshift({id:'q'+Date.now().toString(36),at:new Date().toISOString(),label:'القرآن',fingerprint,data});localStorage.setItem(sk,JSON.stringify(list.slice(0,5)))}catch{}},700)}function save(){localStorage.setItem(KEY,JSON.stringify(state));quranSnapshot();renderLibrary()}
const byKey=new Map(V.map(v=>[v.s+':'+v.a,v])),bySurah=new Map();for(const v of V){if(!bySurah.has(v.s))bySurah.set(v.s,[]);bySurah.get(v.s).push(v)}
const starts=Array(114).fill(1);for(let s=1;s<=114;s++){const v=V.find(x=>x.s===s&&x.a===1);starts[s-1]=v?.p||1}
function ar(n){return Number(n||0).toLocaleString('ar-BH')}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function norm(s){return String(s||'').normalize('NFKD').replace(/[\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g,'').replace(/[إأآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/ة/g,'ه').toLowerCase().trim()}function rangeEdge(r,end=false){const a=String(r||'').split('-');const k=(end?a[1]:a[0])||a[0]||'1:1';const [s,v]=k.split(':').map(Number);return {s:s||1,a:v||1}}

let current=1,selected=null,touch=null,controlsTimer=null,pendingKey='';const reader=document.getElementById('reader'),lines=document.getElementById('lines'),toast=document.getElementById('toast');

const fontCache=new Map();async function ensureFont(p){const fam='QCFP'+p;if(fontCache.has(p))return fam;const file=`QCF2${String(p).padStart(3,'0')}.ttf`;const url=`./quran/${file}`;const ff=new FontFace(fam,`url('${url}') format('truetype')`);try{await ff.load();document.fonts.add(ff);fontCache.set(p,true);return fam}catch(e){console.error('QCF font load failed:',url,e);throw new Error('missing-qcf-font:'+file)}}
function fit(){requestAnimationFrame(()=>{const box=lines,text=[...box.querySelectorAll('.m-line.text')];if(!text.length)return;const count=text.length;let base=count<=8?30:count<=11?26:23;if(innerWidth<390)base-=1;const fixed=[...box.children].filter(e=>!e.classList.contains('text')).reduce((n,e)=>n+e.scrollHeight,0),slot=Math.max(24,(box.clientHeight-fixed-8)/Math.max(1,count)),verticalMax=Math.max(15,Math.min(31,slot*.58));base=Math.min(base,verticalMax);for(const el of text){let fs=base;el.style.fontSize=fs+'px';while(el.scrollWidth>el.clientWidth+2&&fs>13.5){fs-=.5;el.style.fontSize=fs+'px'}}})}
async function openPage(p){p=Math.max(1,Math.min(604,Number(p)||1));current=p;selected=null;reader.classList.add('active');reader.classList.toggle('night',state.theme==='night');document.getElementById('lineActions').classList.remove('show');lines.innerHTML='<div class="loading"><b>جارٍ فتح صفحة المصحف…</b><span>صفحة '+ar(p)+'</span></div>';try{const fam=await ensureFont(p),d=P[p-1];document.getElementById('headSurah').textContent='سورة '+N[(d.s||1)-1];document.getElementById('headPage').textContent='صفحة '+ar(p)+' من ٦٠٤';document.getElementById('pageNo').textContent=ar(p);document.getElementById('controlPage').textContent=ar(p);document.getElementById('readerTitle').textContent='سورة '+N[(d.s||1)-1];let h='';for(const x of d.lines){if(x.type==='header'){h+=`<div class="m-line header">۞ سورة ${esc(N[x.surah-1])} ۞</div>`}else if(x.type==='basmala'){h+=`<div class="m-line basmala" style="font-family:${fam}">ﭑﭒﭓ</div>`}else{const saved=state.last?.page===p&&Number(state.last.line)===Number(x.line);h+=`<div class="m-line text${saved?' saved':''}${x.center?' center':''}" style="font-family:${fam}" data-line="${x.line}" data-range="${esc(x.r||'')}">${x.g}</div>`}}lines.innerHTML=h;fit();if(pendingKey){const hit=[...lines.querySelectorAll('.m-line.text')].find(el=>rangeContains(el.dataset.range,pendingKey));if(hit)setTimeout(()=>selectLine(hit),40);pendingKey=''}controls(true);history.replaceState(null,'','#p='+p);if(p<604)setTimeout(()=>ensureFont(p+1).catch(()=>{}),700)}catch(e){console.error(e);lines.innerHTML='<div class="loading"><b>تعذر فتح خط الصفحة</b><span>تأكد أن ملف QCF2'+String(p).padStart(3,'0')+'.ttf موجود داخل مجلد quran في GitHub.</span></div>';controls(false)}}
function selectLine(el){selected=el;document.querySelectorAll('.m-line.text').forEach(x=>x.classList.toggle('selected',x===el));document.getElementById('lineActions').classList.add('show');controls(false)}function selectedEdge(){return rangeEdge(selected?.dataset.range||P[current-1]?.a1,true)}
function saveHere(){if(!selected)return say('اضغط على السطر أولًا');const e=selectedEdge();state.last={page:current,line:+selected.dataset.line,surah:e.s,ayah:e.a,at:new Date().toISOString()};save();document.querySelectorAll('.m-line.saved').forEach(x=>x.classList.remove('saved'));selected.classList.add('saved');say('تم حفظ موضع القراءة ✓')}
async function copyRange(r){const txt=ayahTextRange(r);if(!txt)return say('لا يوجد نص للنسخ');try{await navigator.clipboard.writeText(txt);say('تم نسخ النص العثماني ✓')}catch{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();say('تم النسخ ✓')}}

function addBookmark(s,a,p=current,line=0){state.bookmarks.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),s:+s,a:+a,p:+p,line:+line||0,at:new Date().toISOString()});state.bookmarks=state.bookmarks.slice(-100);save();say('تمت إضافة علامة 🔖')}
function rangeContains(r,k){if(!r||!k)return false;const a=rangeEdge(r),b=rangeEdge(r,true),[s,n]=String(k).split(':').map(Number),x=s*1000+n;return x>=a.s*1000+a.a&&x<=b.s*1000+b.a}function openAyah(k){const v=byKey.get(k);if(v){pendingKey=k;openPage(v.p)}}
document.addEventListener('click',e=>{const tab=e.target.closest('[data-tab]');if(tab){switchTab(tab.dataset.tab);return}const s=e.target.closest('[data-open-surah]');if(s){openPage(starts[+s.dataset.openSurah-1]);return}const fs=e.target.closest('[data-fav-surah]');if(fs){e.preventDefault();e.stopPropagation();const n=+fs.dataset.favSurah,i=state.favSurahs.indexOf(n);if(i>=0)state.favSurahs.splice(i,1);else state.favSurahs.push(n);save();return}const oa=e.target.closest('[data-open-ayah]');if(oa){openAyah(oa.dataset.openAyah);return}const fa=e.target.closest('[data-fav-ayah]');if(fa){toggleFavKey(fa.dataset.favAyah);return}const cp=e.target.closest('[data-copy-key]');if(cp){copyRange(cp.dataset.copyKey);return}const bm=e.target.closest('[data-bookmark-key]');if(bm){const v=byKey.get(bm.dataset.bookmarkKey);if(v)addBookmark(v.s,v.a,v.p,0);return}const db=e.target.closest('[data-del-bookmark]');if(db){state.bookmarks=state.bookmarks.filter(x=>x.id!==db.dataset.delBookmark);save();return}const ml=e.target.closest('.m-line.text');if(ml){selectLine(ml);return}})
document.getElementById('continueBtn').onclick=()=>openPage(state.last?.page||1);document.getElementById('openLastBookmark').onclick=()=>{const b=state.bookmarks.at(-1);b?openPage(b.p):say('لا توجد علامة بعد')};document.getElementById('pageJumpBtn').onclick=()=>openPage(document.getElementById('pageJump').value);document.getElementById('pageJump').onkeydown=e=>{if(e.key==='Enter')openPage(e.target.value)};document.getElementById('clearSearch').onclick=()=>{document.getElementById('search').value='';switchTab('surahs')};let st=null;document.getElementById('search').oninput=e=>{clearTimeout(st);st=setTimeout(()=>{const q=norm(e.target.value);if(q.length<2){switchTab('surahs');return}const rs=V.filter(v=>norm(v.t).includes(q)).slice(0,80);document.getElementById('resultList').innerHTML=rs.length?rs.map(resultCard).join(''):'<div class="empty">ما لقيت نتيجة مطابقة.</div>';switchTab('search')},150)}
document.getElementById('exitReader').onclick=()=>{window.location.replace('index.html?open=religion')};document.getElementById('themeBtn').onclick=()=>{state.theme=state.theme==='night'?'paper':'night';save();reader.classList.toggle('night',state.theme==='night');document.getElementById('themeBtn').textContent=state.theme==='night'?'☀':'☾'};document.getElementById('prevPage').onclick=()=>current>1&&openPage(current-1);document.getElementById('nextPage').onclick=()=>current<604&&openPage(current+1);document.getElementById('toggleControls').onclick=()=>controls(false);document.getElementById('saveHere').onclick=saveHere;document.getElementById('copyAyah').onclick=()=>selected&&copyRange(selected.dataset.range);document.getElementById('favAyah').onclick=()=>{if(!selected)return;const e=selectedEdge();toggleFavKey(e.s+':'+e.a)};document.getElementById('bookmarkAyah').onclick=()=>{if(!selected)return;const e=selectedEdge();addBookmark(e.s,e.a,current,+selected.dataset.line)}
stage.addEventListener('touchstart',e=>{if(e.touches.length!==1){touch=null;return}const t=e.touches[0];touch={x:t.clientX,y:t.clientY,at:Date.now(),target:e.target}},{passive:true});stage.addEventListener('touchmove',e=>{if(e.touches.length>1)touch=null;const sel=window.getSelection?.();if(sel&&!sel.isCollapsed)touch=null},{passive:true});stage.addEventListener('touchend',e=>{if(!touch)return;const sel=window.getSelection?.();if(sel&&!sel.isCollapsed){touch=null;controls(true);return}const t=e.changedTouches[0],dx=t.clientX-touch.x,dy=t.clientY-touch.y,duration=Date.now()-touch.at,target=touch.target;touch=null;if(duration>650||target?.closest?.('.m-line.text'))return;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.35){if(dx>0&&current<604)openPage(current+1);else if(dx<0&&current>1)openPage(current-1)}},{passive:true});stage.addEventListener('click',e=>{if(!e.target.closest('.m-line.text')&&!e.target.closest('.line-actions'))controls(true)});addEventListener('resize',fit);setTimeout(()=>document.getElementById('hint').style.display='none',3500);const hp=location.hash.match(/p=(\d+)/);if(hp)openPage(+hp[1]);
})();
